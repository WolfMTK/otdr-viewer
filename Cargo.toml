[package]
name = "otdr-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
stylance = "0.8.4"
web-sys = { version = "0.3.102", features = [
    "EventTarget",
    "Window",
    "MouseEvent",
    "KeyboardEvent",
    "Element",
    "DomRect",
    "SvgsvgElement",
    "WheelEvent"
] }
shared-types = { path = "shared-types" }
leptos-use = "0.19.0"
serde = { workspace = true }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4.32"

[dev-dependencies]
rstest = "0.26.1"

[workspace]
members = ["shared-types", "src-tauri"]

[package.metadata.stylance]
output_file = "./styles/bundle.css"
