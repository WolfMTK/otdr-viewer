[package]
name = "otdr-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
stylance = "0.8.4"

[workspace]
members = ["src-tauri"]

[package.metadata.stylance]
output_file = "./styles/bundle.css"
